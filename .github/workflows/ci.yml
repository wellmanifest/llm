name: llm-standard-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run governed checks
        run: ./project/governance-check.sh --actor ci
      - name: Run standard checks when available
        run: if [[ -f Makefile ]]; then make check; fi

  windows-governance:
    runs-on: windows-latest
    steps:
      - name: Preserve managed LF digests
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run Windows governance entrypoint
        shell: cmd
        run: project\governance-check.bat --actor ci
